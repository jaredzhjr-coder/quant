[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadlab-research"
version = "0.1.0"
description = "Auditable, cost-aware walk-forward pairs research"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
spreadlab = "spreadlab.cli:main"

[tool.setuptools.packages.find]
include = ["spreadlab*"]
